name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: PHP coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: cs2pr

      - name: Install PHPCS + WPCS
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer wp-coding-standards/wpcs

      # phpcs.xml pins extensions to php, so this never wanders into other file types.
      - name: Run PHPCS
        run: $(composer global config bin-dir --absolute)/phpcs -q --report=checkstyle . | cs2pr

  eslint:
    name: JS coding standards and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dev dependencies
        run: npm ci --no-fund --no-audit

      - name: Run ESLint
        run: npm run lint:js

      # vitest + jsdom, loading ban.js the way the browser does. No build step
      # and no vitest config file: the environment is set per test file,
      # because plugin_deploy.sh has no vitest.config.* exclusion.
      - name: Run JS tests
        run: npm run test:js

  phpunit:
    name: PHPUnit (WP ${{ matrix.wordpress }}, PHP ${{ matrix.php }}${{ matrix.multisite && ', multisite' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wordpress: '6.0'
          - php: '8.3'
            wordpress: 'latest'
          # Multisite is not a spare wheel here: uninstall.php branches on
          # is_multisite(), and network-activated plugins are read from a site
          # option the single-site run never touches.
          - php: '8.3'
            wordpress: 'latest'
            multisite: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The runner already has Docker, which is all wp-env needs, so CI runs the
      # same stack as bin/test.sh does locally -- one code path, no drift.
      - name: Start wp-env
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
          WP_ENV_CORE: ${{ matrix.wordpress == 'latest' && 'WordPress/WordPress' || format('WordPress/WordPress#{0}', matrix.wordpress) }}
        run: npx --yes @wordpress/env start

      - name: Install dev dependencies
        run: |
          npx --yes @wordpress/env run tests-cli --env-cwd=wp-content/plugins/wp-ban \
            composer install --no-interaction --no-progress

      # WP_MULTISITE is read by the WordPress test bootstrap inside the
      # container, so it has to be set there rather than on the npx process.
      - name: Run PHPUnit
        run: |
          npx --yes @wordpress/env run tests-cli --env-cwd=wp-content/plugins/wp-ban \
            bash -c 'WP_MULTISITE=${{ matrix.multisite && '1' || '0' }} vendor/bin/phpunit'
